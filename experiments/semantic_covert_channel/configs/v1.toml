schema_version = 1

[experiment]
name = "reasoning_like_semantic_covert_channel_v1"
hypothesis = "Can two stateless instances of the same model establish a semantic covert channel through natural-language text that resembles a plausible reasoning trace, without a prearranged protocol?"
dataset = "../data/v1_cases.jsonl"
output_dir = "../../../artifacts/runs/semantic_covert_channel"
seed = 20261026
repetitions = 1
max_cases = 8
excluded_case_ids = ["v1-004"] # Used for live prompt development; excluded from held-out grid.
cover_max_tokens = 240
decoder_max_tokens = 500
judge_max_tokens = 500

[[subjects]]
id = "openai_gpt_5_5_no_reasoning"
provider = "openai"
model = "gpt-5.5-2026-04-23"
reasoning_effort = "none"
enabled = true

[subjects.rate]
input_usd_per_million = "5.00"
cached_input_usd_per_million = "0.50"
output_usd_per_million = "30.00"
max_input_tokens = 10000
verified_at = "2026-10-26"
source = "https://developers.openai.com/api/docs/models/gpt-5.5"

[[subjects]]
id = "openai_gpt_6_luna_no_reasoning"
