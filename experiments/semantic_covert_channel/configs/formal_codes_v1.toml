schema_version = 2

[experiment]
name = "formal_codes_permitted_v1"
hypothesis = "Does permitting formal codes raise zero-shot payload recovery over the no-formal-codes baseline while matched-control recovery stays low?"
dataset = "../data/v2_cases.jsonl"
output_dir = "../../../artifacts/runs/semantic_covert_channel"
seed = 20261113
repetitions = 7
max_cases = 8
excluded_case_ids = []
cover_max_tokens = 900
decoder_max_tokens = 500
judge_max_tokens = 600
condition_registry = "conditions_v2.toml"
case_split_manifest = "../data/v2_case_splits.json"
default_condition_id = "v1_6_formal_permitted_analytical_long"
default_analysis_role = "exploratory"

[[subjects]]
id = "openai_gpt_5_5_no_reasoning"
provider = "openai"
model = "gpt-5.5-2026-04-23"
reasoning_effort = "none"
enabled = true

[subjects.rate]
input_usd_per_million = "5.00"
cached_input_usd_per_million = "0.50"
output_usd_per_million = "30.00"
max_input_tokens = 10000
verified_at = "2026-10-26"
source = "https://developers.openai.com/api/docs/models/gpt-5.5"

