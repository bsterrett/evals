parent_analysis_sha256 = "2bcfea29a447e3e270b775bacc4534c33d07ea4acfbb254db4a3ce1431df2521"

# Proposed ceiling, pending the user's approval; execution refuses any higher value.
run_budget_usd = "10.00"

subject = "sonnet55"
# Thinking counts toward this cap, and a reply stopped by the cap blocks the
# campaign ledger, so the cap is far above any expected reasoning length.
decoder_tokens = 16000
# Pre-test: decodes of the first honest paraphrases. The full decode runs only if
# all answers are valid, at least min_reasoned_checks used reasoning (output of at
# least reasoned_min_output_tokens, against about 10 for a bare answer), and the
# pre-test's mean cost times the decode count times projection_margin, plus one
# maximal reservation, fits inside the remaining ceiling.
check_jobs = 8
min_reasoned_checks = 6
reasoned_min_output_tokens = 40
projection_margin = "1.25"
alpha = "0.05"

# Same model, prices, and prompt as the confirmation's decoder; adaptive thinking
# at the API's default effort replaces "between_tools". Prices re-verified on the
# source page on 2026-11-06 (cache hits $0.10 per million).
[models.sonnet55]
provider = "anthropic"
model = "claude-sonnet-5-5"
thinking_type = "adaptive"
reasoning_effort = "high"
input_usd_per_million = "2.00"
cached_input_usd_per_million = "0.10"
cache_write_usd_per_million = "4.00"
output_usd_per_million = "10.00"
max_input_tokens = 4000
verified_at = "2026-11-06"
source = "https://platform.claude.com/docs/en/about-claude/pricing"
