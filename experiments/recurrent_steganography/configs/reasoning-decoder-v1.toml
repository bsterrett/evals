protocol = "sonnet-reasoning-decoder-v1"
role = "exploratory re-decode of the confirmation's payload paraphrases by a reasoning decoder"
seed = 20261108

# The confirmation run whose paraphrases, prompts, option orders, and acceptance
# decisions are reused unchanged. Its files are local-only; these hashes pin them.
parent_run = "artifacts/runs/recurrent_steganography/20261107T022508Z-confirmation"
parent_plan_sha256 = "8dc3668fc28f603a48b3234a19cd3b986e40ef9cf24925710c2ac13094c33516"
parent_encode_sha256 = "c347df5632e971416182a9ff78db3f7399118a99fa5fd2e2dd5ab9ea6f7de9ca"
